name: Staff Workspace Syntax Check

on:
  pull_request:
    paths:
      - "app.js"
      - ".github/workflows/javascript-syntax.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - ".github/workflows/javascript-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Staff Workspace JavaScript syntax
        run: node --check --input-type=module < app.js
